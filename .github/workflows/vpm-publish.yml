name: VPM Publish

on:
  workflow_dispatch:
    inputs:
      packages:
        description: >-
          Package folder names to publish (comma or newline separated).
          Example: net.minetake.basis.transparent-mirror
        required: true
        type: string
      tag_override:
        description: 'Release tag (e.g. v1.0.0). Required when stable=true.'
        required: false
      stable:
        description: 'Stable release — use package.json versions as-is, no dev suffix.'
        type: boolean
        default: true

concurrency:
  group: vpm-publish
  cancel-in-progress: false

permissions:
  contents: write

env:
  VPM_BRANCH: vpm
  VPM_INDEX_FILE: vpm-repo.json
  VPM_SELF_URL: https://basis.minetake.net/vpm-repo.json

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate packages input
        id: pkgs
        env:
          PACKAGES_INPUT: ${{ inputs.packages }}
        run: |
          set -euo pipefail
          # Normalize comma/newline separated list to comma-separated for vpmpackagegen.
          NORMALIZED="$(printf '%s' "$PACKAGES_INPUT" | tr ',\n' '  ' | xargs | tr ' ' ',')"
          if [ -z "$NORMALIZED" ]; then
            echo "::error::packages input is empty"
            exit 1
          fi
          MANIFEST=".github/vpm-packages.txt"
          while IFS= read -r pkg; do
            if ! grep -qxF "$pkg" "$MANIFEST"; then
              echo "::error::${pkg} is not listed in ${MANIFEST}"
              exit 1
            fi
            if [ ! -f "Packages/${pkg}/package.json" ]; then
              echo "::error::Packages/${pkg}/package.json not found — run Sync from Basis first"
              exit 1
            fi
          done < <(printf '%s' "$NORMALIZED" | tr ',' '\n')
          echo "list=$NORMALIZED" >> "$GITHUB_OUTPUT"

      - name: Compute tag and dev suffix
        id: meta
        env:
          TAG_OVERRIDE: ${{ inputs.tag_override }}
          RUN_NUMBER: ${{ github.run_number }}
          STABLE: ${{ inputs.stable }}
        run: |
          set -euo pipefail
          if [ "${STABLE:-false}" = "true" ]; then
            if [ -z "${TAG_OVERRIDE}" ]; then
              echo "::error::stable=true requires tag_override (e.g. v1.0.0)"
              exit 1
            fi
            TAG="${TAG_OVERRIDE}"
            SUFFIX=""
          else
            TAG="${TAG_OVERRIDE:-vpm-$(date -u +%G-W%V).${RUN_NUMBER}}"
            SUFFIX="dev.$(date -u +%G.W%V).${RUN_NUMBER}"
          fi
          {
            echo "tag=$TAG"
            echo "suffix=$SUFFIX"
            echo "stable=${STABLE:-false}"
          } >> "$GITHUB_OUTPUT"

      - name: Stage previous index
        id: stage
        run: |
          set -euo pipefail
          mkdir -p prev
          if git ls-remote --exit-code --heads origin "$VPM_BRANCH" >/dev/null 2>&1; then
            git fetch --depth=1 origin "$VPM_BRANCH"
            git show "FETCH_HEAD:$VPM_INDEX_FILE" > "prev/$VPM_INDEX_FILE" 2>/dev/null \
              || { echo "::error::$VPM_BRANCH branch exists but $VPM_INDEX_FILE is missing on it"; exit 1; }
            [ -s "prev/$VPM_INDEX_FILE" ] \
              || { echo "::error::$VPM_INDEX_FILE on $VPM_BRANCH is empty"; exit 1; }
            echo "first_run=false" >> "$GITHUB_OUTPUT"
          else
            : > "prev/$VPM_INDEX_FILE"
            echo "first_run=true" >> "$GITHUB_OUTPUT"
            echo "First run: $VPM_BRANCH branch does not exist yet."
          fi

      - name: Build packages
        env:
          DEV_SUFFIX: ${{ steps.meta.outputs.suffix }}
          PACKAGE_LIST: ${{ steps.pkgs.outputs.list }}
        run: |
          python3 .github/scripts/vpmpackagegen.py build \
            --dev-suffix "$DEV_SUFFIX" \
            --packages "$PACKAGE_LIST" \
            --out out

      - name: Generate new index
        id: index
        env:
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          TAG: ${{ steps.meta.outputs.tag }}
          STABLE: ${{ steps.meta.outputs.stable }}
        run: |
          set -euo pipefail
          BASE_URL="${SERVER_URL}/${REPO}/releases/download/${TAG}"
          echo "::notice title=VPM Repo URL::$VPM_SELF_URL"
          python3 .github/scripts/vpmpackagegen.py update-index \
            --self-url "$VPM_SELF_URL" \
            --added-list added.txt \
            "prev/$VPM_INDEX_FILE" \
            "$BASE_URL" \
            out/meta > new-index.json
          if [ -s added.txt ]; then
            count=$(wc -l < added.txt)
            echo "Added ${count} package version(s)."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Added packages (${count})"
              echo
              while IFS=$'\t' read -r name version _zip; do
                echo "- \`${name}\` @ \`${version}\`"
              done < added.txt
            } > release-body.md
            cat release-body.md >> "$GITHUB_STEP_SUMMARY"
          else
            if [ "${STABLE}" = "true" ]; then
              echo "::error::stable=true but no new package versions were added — bump version in package.json."
              exit 1
            fi
            echo "Re-run with no new versions; release and push will be skipped."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release and upload zips
        if: steps.index.outputs.has_changes == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: VPM ${{ steps.meta.outputs.tag }}
          body_path: release-body.md
          prerelease: ${{ steps.meta.outputs.stable != 'true' }}
          files: out/artifacts/*.zip
          fail_on_unmatched_files: true

      - name: Publish to vpm branch
        if: steps.index.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
          FIRST_RUN: ${{ steps.stage.outputs.first_run }}
        run: |
          set -euo pipefail
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          URL="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"

          if [ "$FIRST_RUN" = "true" ]; then
            git init -q -b "$VPM_BRANCH" vpm-pub
            git -C vpm-pub remote add origin "$URL"
          else
            git clone -q --depth 1 --branch "$VPM_BRANCH" --single-branch "$URL" vpm-pub
          fi

          cp new-index.json "vpm-pub/$VPM_INDEX_FILE"
          echo "basis.minetake.net" > "vpm-pub/CNAME"
          cd vpm-pub
          git add "$VPM_INDEX_FILE" CNAME
          git commit -q -m "vpm: $TAG"
          git push -u origin "$VPM_BRANCH"
