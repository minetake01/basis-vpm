name: VPM Publish

# Triggered automatically by the Basis "Publish Minetake VPM" workflow.
# Version, prerelease, and release timing are decided in the Basis monorepo.

on:
  repository_dispatch:
    types: [vpm-publish]

concurrency:
  group: vpm-publish
  cancel-in-progress: false

permissions:
  contents: write

env:
  VPM_BRANCH: vpm
  VPM_INDEX_FILE: vpm-repo.json
  VPM_SELF_URL: https://basis.minetake.net/vpm-repo.json

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve publish parameters
        id: params
        env:
          PACKAGE: ${{ github.event.client_payload.package }}
          BASE_VERSION: ${{ github.event.client_payload.base_version }}
          PUBLISH_VERSION: ${{ github.event.client_payload.publish_version }}
          DISPLAY_NAME: ${{ github.event.client_payload.display_name }}
          TAG: ${{ github.event.client_payload.tag }}
          RELEASE_NAME: ${{ github.event.client_payload.release_name }}
          PRERELEASE: ${{ github.event.client_payload.prerelease }}
          BRANCH: ${{ github.event.client_payload.source_branch }}
        run: |
          set -euo pipefail
          if [ -z "$PACKAGE" ] || [ -z "$PUBLISH_VERSION" ] || [ -z "$BASE_VERSION" ]; then
            echo "::error::repository_dispatch payload must include package, base_version, and publish_version"
            exit 1
          fi
          if [ -z "$DISPLAY_NAME" ]; then
            echo "::error::repository_dispatch payload must include display_name"
            exit 1
          fi
          if [ -z "$TAG" ]; then
            echo "::error::repository_dispatch payload must include tag"
            exit 1
          fi
          if [ -z "$RELEASE_NAME" ]; then
            RELEASE_NAME="${DISPLAY_NAME} ${PUBLISH_VERSION}"
          fi
          MANIFEST=".github/vpm-packages.txt"
          if ! grep -qxF "$PACKAGE" "$MANIFEST"; then
            echo "::error::${PACKAGE} is not listed in ${MANIFEST}"
            exit 1
          fi
          PKG_JSON="Packages/${PACKAGE}/package.json"
          if [ ! -f "$PKG_JSON" ]; then
            echo "::error::${PKG_JSON} not found — run Publish Minetake VPM from Basis first"
            exit 1
          fi
          HUB_VERSION="$(python3 -c "import json; print(json.load(open('${PKG_JSON}', encoding='utf-8-sig'))['version'])")"
          if [ "$HUB_VERSION" != "$BASE_VERSION" ] && [ "$HUB_VERSION" != "$PUBLISH_VERSION" ]; then
            echo "::error::hub package.json version (${HUB_VERSION}) does not match previous (${BASE_VERSION}) or publish (${PUBLISH_VERSION})"
            exit 1
          fi
          {
            echo "package=$PACKAGE"
            echo "base_version=$BASE_VERSION"
            echo "publish_version=$PUBLISH_VERSION"
            echo "display_name=$DISPLAY_NAME"
            echo "tag=$TAG"
            echo "release_name=$RELEASE_NAME"
            echo "prerelease=${PRERELEASE:-false}"
            echo "list=$PACKAGE"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing \`${PACKAGE}@${PUBLISH_VERSION}\` (tag \`${TAG}\`, from Basis branch \`${BRANCH}\`)" >> "$GITHUB_STEP_SUMMARY"

      - name: Update hub package.json
        env:
          PACKAGE: ${{ steps.params.outputs.package }}
          PUBLISH_VERSION: ${{ steps.params.outputs.publish_version }}
        run: |
          python3 .github/scripts/publish_helpers.py set-version \
            "Packages/${PACKAGE}/package.json" \
            "${PUBLISH_VERSION}"

      - name: Commit package.json on main
        env:
          PACKAGE: ${{ steps.params.outputs.package }}
          PUBLISH_VERSION: ${{ steps.params.outputs.publish_version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Packages/${PACKAGE}/package.json"
          if git diff --staged --quiet; then
            echo "package.json already at ${PUBLISH_VERSION}"
          else
            git commit -m "publish: ${PACKAGE}@${PUBLISH_VERSION}"
            git push
          fi

      - name: Stage previous index
        id: stage
        run: |
          set -euo pipefail
          mkdir -p prev
          if git ls-remote --exit-code --heads origin "$VPM_BRANCH" >/dev/null 2>&1; then
            git fetch --depth=1 origin "$VPM_BRANCH"
            git show "FETCH_HEAD:$VPM_INDEX_FILE" > "prev/$VPM_INDEX_FILE" 2>/dev/null \
              || { echo "::error::$VPM_BRANCH branch exists but $VPM_INDEX_FILE is missing on it"; exit 1; }
            [ -s "prev/$VPM_INDEX_FILE" ] \
              || { echo "::error::$VPM_INDEX_FILE on $VPM_BRANCH is empty"; exit 1; }
            echo "first_run=false" >> "$GITHUB_OUTPUT"
          else
            : > "prev/$VPM_INDEX_FILE"
            echo "first_run=true" >> "$GITHUB_OUTPUT"
            echo "First run: $VPM_BRANCH branch does not exist yet."
          fi

      - name: Build packages
        env:
          PACKAGE_LIST: ${{ steps.params.outputs.list }}
        run: |
          python3 .github/scripts/vpmpackagegen.py build \
            --packages "$PACKAGE_LIST" \
            --out out

      - name: Generate new index
        id: index
        env:
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          TAG: ${{ steps.params.outputs.tag }}
        run: |
          set -euo pipefail
          BASE_URL="${SERVER_URL}/${REPO}/releases/download/${TAG}"
          echo "::notice title=VPM Repo URL::$VPM_SELF_URL"
          python3 .github/scripts/vpmpackagegen.py update-index \
            --self-url "$VPM_SELF_URL" \
            --added-list added.txt \
            "prev/$VPM_INDEX_FILE" \
            "$BASE_URL" \
            out/meta > new-index.json
          if [ -s added.txt ]; then
            count=$(wc -l < added.txt)
            echo "Added ${count} package version(s)."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Added packages (${count})"
              echo
              while IFS=$'\t' read -r name version _zip; do
                echo "- \`${name}\` @ \`${version}\`"
              done < added.txt
            } > release-body.md
            cat release-body.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::version ${{ steps.params.outputs.publish_version }} is already in the VPM index — bump version in Basis package.json or use prerelease"
            exit 1
          fi

      - name: Create release and upload zips
        if: steps.index.outputs.has_changes == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.params.outputs.tag }}
          name: ${{ steps.params.outputs.release_name }}
          body_path: release-body.md
          prerelease: ${{ steps.params.outputs.prerelease == 'true' }}
          files: out/artifacts/*.zip
          fail_on_unmatched_files: true

      - name: Publish to vpm branch
        if: steps.index.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.params.outputs.tag }}
          FIRST_RUN: ${{ steps.stage.outputs.first_run }}
        run: |
          set -euo pipefail
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          URL="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"

          if [ "$FIRST_RUN" = "true" ]; then
            git init -q -b "$VPM_BRANCH" vpm-pub
            git -C vpm-pub remote add origin "$URL"
          else
            git clone -q --depth 1 --branch "$VPM_BRANCH" --single-branch "$URL" vpm-pub
          fi

          cp new-index.json "vpm-pub/$VPM_INDEX_FILE"
          echo "basis.minetake.net" > "vpm-pub/CNAME"
          cd vpm-pub
          git add "$VPM_INDEX_FILE" CNAME
          git commit -q -m "vpm: $TAG"
          git push -u origin "$VPM_BRANCH"
